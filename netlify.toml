[build]
  publish = "public"
  command = "./build.sh"

[build.environment]
  PHP_VERSION = "8.1"
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.php"
  status = 200

[context.production.environment]
  APP_ENV = "production"
  APP_DEBUG = "false"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/tmp/database.sqlite"

[context.deploy-preview.environment]
  APP_ENV = "staging"
  APP_DEBUG = "true"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/tmp/database.sqlite"

[context.branch-deploy.environment]
  APP_ENV = "staging"
  APP_DEBUG = "true"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/tmp/database.sqlite"